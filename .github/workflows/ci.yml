name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  PYTHON_DEFAULT_VERSION: "3.14"
  UV_VERSION: "0.13.4"
  # The b2-simulator release the unit tests run against (v0.6.0); every checkout refers to it.
  SIMULATOR_REVISION: "4052c6f8f45350486460d19bc796866cbdcdd3bc"

jobs:
  lint:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # actions-governance: replaced by Check spelling; remove after a real run verifies the replacement
      # - uses: codespell-project/actions-codespell@2391250ab05295bddd51e36a8c6295edb6343b0e
      #   with:
      #     ignore_words_list: datas re-use
      - name: Check spelling
        # Preserve the original action's effective CLI arguments, including its positional path.
        run: pipx run codespell --count --skip ./.git --ignore-words-list datas re-use
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --only-group nox --locked
      - name: Run linters
        run: uv run nox -vs lint
      - name: Validate new changelog entries
        if: (contains(github.event.pull_request.labels.*.name, '-changelog') == false) && (github.event.pull_request.base.ref != '')
        run: |
          mapfile -t changed_files < <(git diff --diff-filter=ACMR --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD)

          if [ "${#changed_files[@]}" -eq 1 ] && [ "${changed_files[0]}" = "uv.lock" ]; then
            echo "Skipping changelog validation for lockfile-only change."
            exit 0
          fi

          if [ -z "$(git diff --diff-filter=A --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD -- changelog.d)" ]; then
            echo "No changelog item added."
            exit 1
          fi
      - name: Changelog validation
        run: uv run nox -vs towncrier_check
  build:
    timeout-minutes: 30
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --only-group nox --locked
      - name: Build the distribution
        run: uv run nox -vs build
      - name: Check documentation example imports
        run: uv run nox -vs doc_examples
  cleanup_buckets:
    # Live B2 access requires explicit opt-in and is never allowed for drafts.
    if: ${{ vars.B2_LIVE_TESTS_ENABLED == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    timeout-minutes: 30
    needs: lint
    env:
      B2_TEST_APPLICATION_KEY: ${{ (vars.B2_LIVE_TESTS_ENABLED == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)) && secrets.B2_TEST_APPLICATION_KEY || '' }}
      B2_TEST_APPLICATION_KEY_ID: ${{ (vars.B2_LIVE_TESTS_ENABLED == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)) && secrets.B2_TEST_APPLICATION_KEY_ID || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ env.B2_TEST_APPLICATION_KEY != '' && env.B2_TEST_APPLICATION_KEY_ID != '' }}  # TODO: skip this whole job instead
        with:
          fetch-depth: 0
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        if: ${{ env.B2_TEST_APPLICATION_KEY != '' && env.B2_TEST_APPLICATION_KEY_ID != '' }}  # TODO: skip this whole job instead
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: ${{ env.B2_TEST_APPLICATION_KEY != '' && env.B2_TEST_APPLICATION_KEY_ID != '' }}  # TODO: skip this whole job instead
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        if: ${{ env.B2_TEST_APPLICATION_KEY != '' && env.B2_TEST_APPLICATION_KEY_ID != '' }}  # TODO: skip this whole job instead
        run: uv sync --only-group nox --locked
      - name: Find and remove old buckets
        if: ${{ env.B2_TEST_APPLICATION_KEY != '' && env.B2_TEST_APPLICATION_KEY_ID != '' }}  # TODO: skip this whole job instead
        run: uv run nox -vs cleanup_old_buckets
  test:
    timeout-minutes: 90
    needs: [lint, cleanup_buckets]
    if: ${{ !cancelled() && needs.lint.result == 'success' && (needs.cleanup_buckets.result == 'success' || needs.cleanup_buckets.result == 'skipped') }}
    env:
      B2_TEST_APPLICATION_KEY: ${{ (vars.B2_LIVE_TESTS_ENABLED == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)) && secrets.B2_TEST_APPLICATION_KEY || '' }}
      B2_TEST_APPLICATION_KEY_ID: ${{ (vars.B2_LIVE_TESTS_ENABLED == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)) && secrets.B2_TEST_APPLICATION_KEY_ID || '' }}
      NOX_EXTRAS: ${{ matrix.extras }}
      # A boolean only; the key itself never enters a shell.
      SIMULATOR_DEPLOY_KEY_SET: ${{ secrets.SIMULATOR_DEPLOY_KEY != '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.10"]
        extras: [ "" ]
        exclude:
          - os: "macos-latest"
            python-version: "pypy3.10"
          - os: "windows-latest"
            python-version: "pypy3.10"
        include:
          - python-version: "3.12"
            extras: "full"
            os: "ubuntu-latest"
    steps:
      # The unit tests need the private b2-simulator, which a fork's pull request cannot check out.
      - name: Require a pull request branch in this repository
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "The unit tests run against the private b2-simulator, which pull requests from forks cannot check out. Push the branch to a branch in $GITHUB_REPOSITORY instead."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: sdk
      - name: Require the b2-simulator deploy key
        if: ${{ env.SIMULATOR_DEPLOY_KEY_SET != 'true' }}
        shell: bash
        run: |
          echo "::error::SIMULATOR_DEPLOY_KEY is missing. The unit tests run against b2-simulator. A repository admin must add SIMULATOR_DEPLOY_KEY as an Actions secret and as a Dependabot secret (Dependabot pull requests only receive Dependabot secrets)."
          exit 1
      - name: Check out the pinned b2-simulator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: backblaze-labs/b2-simulator
          ref: ${{ env.SIMULATOR_REVISION }}
          ssh-key: ${{ secrets.SIMULATOR_DEPLOY_KEY }}
          persist-credentials: false
          path: simulator
      - name: Verify the b2-simulator revision
        shell: bash
        run: |
          test "$(git -C simulator rev-parse HEAD)" = "$SIMULATOR_REVISION"
          test -z "$(git -C simulator status --short)"
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        working-directory: sdk
        run: uv sync --only-group nox --locked
      - name: Run unit tests
        working-directory: sdk
        env:
          B2_SIMULATOR_DIR: ${{ github.workspace }}/simulator
        run: uv run nox -vs unit -- -v
      - name: Run integration tests
        if: ${{ (vars.B2_LIVE_TESTS_ENABLED == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)) && env.B2_TEST_APPLICATION_KEY != '' && env.B2_TEST_APPLICATION_KEY_ID != '' }}
        working-directory: sdk
        run: uv run nox -vs integration -- --dont-cleanup-old-buckets -v
  cli-compat:
    timeout-minutes: 90
    needs: [lint, cleanup_buckets]
    if: ${{ !cancelled() && needs.lint.result == 'success' && (needs.cleanup_buckets.result == 'success' || needs.cleanup_buckets.result == 'skipped') }}
    env:
      B2_TEST_APPLICATION_KEY: ${{ (vars.B2_LIVE_TESTS_ENABLED == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)) && secrets.B2_TEST_APPLICATION_KEY || '' }}
      B2_TEST_APPLICATION_KEY_ID: ${{ (vars.B2_LIVE_TESTS_ENABLED == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)) && secrets.B2_TEST_APPLICATION_KEY_ID || '' }}
      INSTALL_SDK_FROM: ../b2-sdk-python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: b2-sdk-python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Backblaze/B2_Command_Line_Tool
          path: B2_Command_Line_Tool
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install test binary dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get -y update
          sudo apt-get -y install zsh fish
          sudo chmod -R 755 /usr/share/zsh/vendor-completions /usr/share/zsh
      - name: Install test binary dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install fish
      - name: Install dependencies
        run: uv sync --directory ./B2_Command_Line_Tool --locked --group nox
      - name: Run CLI unit tests
        run: uv run --directory ./B2_Command_Line_Tool nox -vs unit -p ${{ matrix.python-version }}
      - name: Run CLI integration tests (without secrets)
        run: uv run --directory ./B2_Command_Line_Tool nox -vs integration -p ${{ matrix.python-version }} -- -m "not require_secrets"
      - name: Run CLI integration tests (with secrets)
        if: ${{ (vars.B2_LIVE_TESTS_ENABLED == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)) && env.B2_TEST_APPLICATION_KEY != '' && env.B2_TEST_APPLICATION_KEY_ID != '' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' }}
        working-directory: B2_Command_Line_Tool
        run: |
          export VIRTUAL_ENV="$PWD/.nox/integration-3-14"
          export PATH="$VIRTUAL_ENV/bin:$PATH"
          python -m pytest \
            test/integration \
            -n 1 \
            --log-level INFO \
            -W ignore::DeprecationWarning:rst2ansi.visitor: \
            -m "require_secrets" \
            --cleanup \
            --sut "$VIRTUAL_ENV/bin/b2v4"
  doc:
    timeout-minutes: 30
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y graphviz plantuml
      - name: Install dependencies
        run: uv sync --only-group nox --locked
      - name: Build the docs
        run: uv run nox --non-interactive -vs doc
