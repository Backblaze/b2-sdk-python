name: Continuous Delivery

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check release preparation without publishing anywhere'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_DEFAULT_VERSION: '3.14'
  UV_VERSION: '0.13.4'

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-security
    permissions:
      contents: read
      actions: read
      security-events: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require green master and a release commit on master history
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/release_preflight.py
      - name: Restore annotated release tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
      - name: Verify maintainer tag signature
        if: github.event_name == 'push'
        env:
          ENFORCE_SIGNED_TAGS: ${{ vars.ENFORCE_SIGNED_TAGS }}
          TAG: ${{ github.ref_name }}
        run: python scripts/verify_release_tag.py "$TAG"
      - name: Block unresolved release security findings
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SECURITY_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/release_security.py "$REPOSITORY"

  build:
    needs: release-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.notes.outputs.version }}
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --only-group nox --locked
      - name: Assemble a disposable release preview
        if: github.event_name == 'workflow_dispatch'
        run: |
          go run github.com/miniscruff/changie@v1.24.0 batch patch
          go run github.com/miniscruff/changie@v1.24.0 merge
      - name: Validate Changie sources
        run: uv run nox -vs changelog_check
      - name: Extract the exact release notes
        id: notes
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            version=$(go run github.com/miniscruff/changie@v1.24.0 latest)
            version=${version#v}
          else
            version=${TAG#v}
            test ! -n "$(find .changes/unreleased -type f ! -name .gitkeep -print -quit)"
            latest=$(go run github.com/miniscruff/changie@v1.24.0 latest)
            test "${latest#v}" = "$version"
          fi
          awk -v version="$version" -f scripts/release-notes.awk CHANGELOG.md > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and smoke-test the installed distribution
        run: uv run nox -vs build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/b2sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
      - name: Publish verified distributions with PEP 740 attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

  github-release:
    needs: [build, publish-pypi]
    if: >-
      always() && github.event_name == 'push' && needs.build.result == 'success' &&
      needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md --prerelease="$PRERELEASE"
            gh release upload "$TAG" ./dist/* --clobber
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md --prerelease="$PRERELEASE" ./dist/*
          fi
