name: Continuous Delivery

on:
  push:
    tags: ['v*']  # push events to matching v*, i.e. v1.0, v20.15.10

env:
  PYTHON_DEFAULT_VERSION: "3.14"
  UV_VERSION: "0.13.4"
  # The b2-simulator release the unit tests run against (v0.6.0); every checkout refers to it.
  SIMULATOR_REVISION: "4052c6f8f45350486460d19bc796866cbdcdd3bc"

jobs:
  test:
    permissions:
      contents: read
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      # A boolean only; the key itself never enters a shell.
      SIMULATOR_DEPLOY_KEY_SET: ${{ secrets.SIMULATOR_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: sdk
      - name: Require the b2-simulator deploy key
        if: ${{ env.SIMULATOR_DEPLOY_KEY_SET != 'true' }}
        shell: bash
        run: |
          echo "::error::SIMULATOR_DEPLOY_KEY is missing. The unit tests run against b2-simulator. A repository admin must add SIMULATOR_DEPLOY_KEY as an Actions secret and as a Dependabot secret (Dependabot pull requests only receive Dependabot secrets)."
          exit 1
      - name: Check out the pinned b2-simulator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: backblaze-labs/b2-simulator
          ref: ${{ env.SIMULATOR_REVISION }}
          ssh-key: ${{ secrets.SIMULATOR_DEPLOY_KEY }}
          persist-credentials: false
          path: simulator
      - name: Verify the b2-simulator revision
        shell: bash
        run: |
          test "$(git -C simulator rev-parse HEAD)" = "$SIMULATOR_REVISION"
          test -z "$(git -C simulator status --short)"
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        working-directory: sdk
        run: uv sync --only-group nox --locked
      - name: Run unit tests
        working-directory: sdk
        env:
          B2_SIMULATOR_DIR: ${{ github.workspace }}/simulator
        run: uv run nox -vs unit -p ${{ env.PYTHON_DEFAULT_VERSION }} -- -v
  deploy:
    needs: test
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      B2_PYPI_PASSWORD: ${{ secrets.B2_PYPI_PASSWORD }}
    runs-on: ubuntu-latest
    steps:
      - name: Determine if pre-release
        id: prerelease_check
        run: |
          IS_PRERELEASE=$([[ ${{ github.ref }} =~ [^0-9]$ ]] && echo true || echo false)
          export IS_PRERELEASE
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: uv sync --only-group nox --locked
      - name: Build the distribution
        id: build
        run: uv run nox -vs build
      # actions-governance: replaced by Read the Changelog with awk; remove after a real run verifies the replacement
      # - name: Read the Changelog
      #   id: read-changelog
      #   uses: mindsers/changelog-reader-action@v2
      #   with:
      #     version: ${{ steps.build.outputs.version }}
      - name: Read the Changelog with awk
        id: read-changelog
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v version="$VERSION" '
            /^## \[/ {
              if (found) exit
              heading = $0
              sub(/^## \[/, "", heading)
              sub(/\].*$/, "", heading)
              found = (heading == version)
              next
            }
            found { lines[++count] = $0 }
            END {
              if (!found) exit 1
              while (count && lines[count] ~ /^[[:space:]]*$/) count--
              for (i = 1; i <= count; i++)
                printf "%s%s", lines[i], (i < count ? "\n" : "")
            }
          ' CHANGELOG.md > "$notes_file"
          delimiter="changelog_$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          {
            echo "changes<<$delimiter"
            cat "$notes_file"
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      # actions-governance: replaced by Create GitHub release with gh and upload the distribution; remove after a real run verifies the replacement
      # - name: Create GitHub release and upload the distribution
      #   id: create-release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     name: ${{ steps.build.outputs.version }}
      #     body: ${{ steps.read-changelog.outputs.changes }}
      #     draft: ${{ env.ACTIONS_STEP_DEBUG == 'true' }}
      #     prerelease: ${{ steps.prerelease_check.outputs.prerelease }}
      #     files: ${{ steps.build.outputs.asset_path }}
      - name: Create GitHub release with gh and upload the distribution
        id: create-release
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.build.outputs.version }}
          RELEASE_NOTES: ${{ steps.read-changelog.outputs.changes }}
          IS_DRAFT: ${{ env.ACTIONS_STEP_DEBUG == 'true' }}
          IS_PRERELEASE: ${{ steps.prerelease_check.outputs.prerelease }}
          ASSET_PATH: ${{ steps.build.outputs.asset_path }}
        run: |
          notes_file="$RUNNER_TEMP/github-release-notes.md"
          printf '%s' "$RELEASE_NOTES" > "$notes_file"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # Upload assets before publishing the requested final release state.
            gh release create "$TAG" --verify-tag --title "$VERSION" \
              --notes-file "$notes_file" --draft --prerelease="$IS_PRERELEASE"
          fi
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(compgen -G "$ASSET_PATH" || true)
          if ((${#assets[@]})); then
            gh release upload "$TAG" "${assets[@]}" --clobber
          fi
          gh release edit "$TAG" --title "$VERSION" --notes-file "$notes_file" \
            --draft="$IS_DRAFT" --prerelease="$IS_PRERELEASE"
      - name: Upload the distribution to PyPI
        if: ${{ env.B2_PYPI_PASSWORD != '' && steps.prerelease_check.outputs.prerelease == 'false' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          user: __token__
          password: ${{ secrets.B2_PYPI_PASSWORD }}
