name: Live B2 Tests

# Reusable: called by the weekly live workflow and by the release workflow.
on:
  workflow_call:
    inputs:
      cli-compat:
        description: Also run the CLI's secret-marked integration tests with this SDK.
        type: boolean
        required: false
        default: false
    secrets:
      B2_TEST_APPLICATION_KEY_ID:
        required: false
      B2_TEST_APPLICATION_KEY:
        required: false

permissions:
  contents: read

env:
  PYTHON_DEFAULT_VERSION: "3.14"
  UV_VERSION: "0.13.4"

jobs:
  live-b2-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # One group per caller workflow and ref (in a called workflow these are the caller's), so a
    # queued weekly or manual run never replaces a pending release run. Runs from different
    # groups may share the live account; test buckets have unique names and cleanup only removes
    # test buckets older than three hours.
    concurrency:
      group: live-b2-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      LIVE_B2_CREDENTIALS_SET: ${{ secrets.B2_TEST_APPLICATION_KEY_ID != '' && secrets.B2_TEST_APPLICATION_KEY != '' }}
      INSTALL_SDK_FROM: ../sdk
    steps:
      - name: Require live B2 credentials
        if: ${{ env.LIVE_B2_CREDENTIALS_SET != 'true' }}
        run: |
          echo "::error::B2_TEST_APPLICATION_KEY_ID and B2_TEST_APPLICATION_KEY are required. A repository admin must add them as Actions secrets."
          exit 1
      - name: Check out the SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: sdk
      - name: Check out the CLI
        if: ${{ inputs.cli-compat }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Backblaze/B2_Command_Line_Tool
          persist-credentials: false
          path: cli
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install SDK dependencies
        working-directory: sdk
        run: uv sync --only-group nox --locked
      - name: Install CLI dependencies
        if: ${{ inputs.cli-compat }}
        working-directory: cli
        run: uv sync --locked --group nox
      - name: Remove stale test buckets
        working-directory: sdk
        env:
          B2_TEST_APPLICATION_KEY_ID: ${{ secrets.B2_TEST_APPLICATION_KEY_ID }}
          B2_TEST_APPLICATION_KEY: ${{ secrets.B2_TEST_APPLICATION_KEY }}
        run: uv run nox -vs cleanup_old_buckets
      - name: Test against live B2
        id: sdk-live
        working-directory: sdk
        env:
          B2_TEST_APPLICATION_KEY_ID: ${{ secrets.B2_TEST_APPLICATION_KEY_ID }}
          B2_TEST_APPLICATION_KEY: ${{ secrets.B2_TEST_APPLICATION_KEY }}
        run: uv run nox -vs integration -p "$PYTHON_DEFAULT_VERSION" -- --dont-cleanup-old-buckets -v
      # The CLI's secret-marked tests with this SDK, as the old ci.yml cli-compat step ran them.
      - name: Run CLI integration tests with secrets against live B2
        if: ${{ inputs.cli-compat && (success() || steps.sdk-live.conclusion == 'failure') }}
        working-directory: cli
        env:
          B2_TEST_APPLICATION_KEY_ID: ${{ secrets.B2_TEST_APPLICATION_KEY_ID }}
          B2_TEST_APPLICATION_KEY: ${{ secrets.B2_TEST_APPLICATION_KEY }}
        run: |
          uv run nox -vs integration -p "$PYTHON_DEFAULT_VERSION" -- \
            -n 1 -m "require_secrets" --cleanup \
            --sut "$PWD/.nox/integration-${PYTHON_DEFAULT_VERSION//./-}/bin/b2v4"
